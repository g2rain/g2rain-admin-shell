name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate release tag and select image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Expected a tag push, but got ref type '$GITHUB_REF_TYPE'." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must use exact v<major>.<minor>.<patch> format." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag '$GITHUB_REF_NAME' points to a commit that is not in origin/main history." >&2
            exit 1
          fi
          if [[ ! -s "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            echo "Missing release notes: docs/releases/$GITHUB_REF_NAME.md. Add the matching non-empty file to main before creating the tag." >&2
            exit 1
          fi
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          if [[ "$package_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$package_version'." >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${tag_commit}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build \
            --build-arg VITE_BUILD_MODE=production \
            --build-arg IMAGE_VERSION="${{ steps.image.outputs.version }}" \
            --build-arg VCS_REF="${{ steps.image.outputs.commit }}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" \
            --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}" \
            .
      - name: Push image tags
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}"
      - name: Report published image
        run: |
          {
            echo "## GHCR publication complete"
            echo
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}\`"
            echo "- \`${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
